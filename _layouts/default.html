<!DOCTYPE html>
<html>
  <head>
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>

    {% include meta.html %}

    <!--[if lt IE 9]>
      <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />

    <!-- Created with Jekyll Now - http://github.com/barryclark/jekyll-now -->
  </head>

  <body class="{% if page.url == '/' %}home-page{% endif %}">
    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead clearfix">
          <a href="{{ site.baseurl }}/" class="site-avatar"><img src="{{ site.avatar }}" /></a>

          <div class="site-info">
            <h1 class="site-name"><a href="{{ site.baseurl }}/blog">{{ site.name }}</a></h1>
            <p class="site-description">Abjectly sitting on the fence</p>
          </div>

          <nav>
            <a href="{{ site.baseurl }}/blog">Blog</a>
            <a href="{{ site.baseurl }}/categories">Categories</a>
            <a href="{{ site.baseurl }}/feedback">Feedback</a>
            <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch theme">Light</button>
          </nav>
        </header>
      </div>
    </div>

    <div id="main" role="main" class="container">
      {{ content }}
    </div>

    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          {% include svg-icons.html %}
        </footer>
      </div>
    </div>

    <script>
      (function () {
        var storageKey = "site-theme";
        var body = document.body;
        var toggle = document.getElementById("theme-toggle");

        function applyTheme(theme) {
          var isLight = theme === "light";
          body.classList.toggle("theme-light", isLight);

          if (toggle) {
            toggle.textContent = isLight ? "Dark" : "Light";
            toggle.setAttribute("aria-label", isLight ? "Switch to dark theme" : "Switch to light theme");
          }
        }

        var savedTheme = "dark";
        try {
          savedTheme = localStorage.getItem(storageKey) || "dark";
        } catch (e) {
          savedTheme = "dark";
        }

        applyTheme(savedTheme);

        if (toggle) {
          toggle.addEventListener("click", function () {
            var nextTheme = body.classList.contains("theme-light") ? "dark" : "light";
            try {
              localStorage.setItem(storageKey, nextTheme);
            } catch (e) {
              // Ignore storage failures and still apply the theme.
            }
            applyTheme(nextTheme);
          });
        }
      })();
    </script>

    {% include analytics.html %}
  </body>
</html>
