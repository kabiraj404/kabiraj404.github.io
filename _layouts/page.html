---
layout: default
---

<article class="page page-shell">
  <header class="content-header">
    {% if page.title %}
      <h1 class="page-title">{{ page.title }}</h1>
    {% endif %}
    {% if page.description %}
      <p class="page-subtitle">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="entry page-content">
    {{ content }}
  </div>
</article>
