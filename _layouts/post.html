---
layout: default
---

<article class="post post-shell">
  <header class="content-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="date post-date">Written on {{ page.date | date: "%B %e, %Y" }}</p>
  </header>

  <div class="entry post-content">
    {{ content }}
  </div>

  {% include disqus.html %}
</article>
